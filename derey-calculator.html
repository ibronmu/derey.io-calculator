<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .calculator-container {
            width: 400px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-bottom: 20px;
        }

        .calculator {
            display: grid;
            gap: 15px;
        }

        input, select, button {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus, select:focus, button:focus {
            outline: 2px solid #007bff;
        }

        .calc-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .calc-btn:hover {
            background-color: #0056b3;
        }

        .reset-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #a71d2a;
        }

        .result {
            background-color: #f8f9fa;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>Calculator</h1>
        <div class="calculator">
            <input type="number" id="num1" placeholder="Enter first number" aria-label="First number">
            <select name="operator" id="operator" aria-label="Operator">
                <option value="">Choose an operator</option>
                <option value="addition">Addition (+)</option>
                <option value="subtraction">Subtraction (-)</option>
                <option value="multiplication">Multiplication (*)</option>
                <option value="division">Division (/)</option>
            </select>
            <input type="number" id="num2" placeholder="Enter second number" aria-label="Second number">
            <button class="calc-btn" id="calc-btn">Calculate</button>
            <button class="reset-btn" id="reset-btn">Reset</button>
            <div class="error" id="error-msg"></div>
            <div class="result" id="result">Result: --</div>
        </div>
    </div>

    <script>
        const num1 = document.getElementById('num1');
        const num2 = document.getElementById('num2');
        const operator = document.getElementById('operator');
        const calcBtn = document.getElementById('calc-btn');
        const resetBtn = document.getElementById('reset-btn');
        const result = document.getElementById("result");
        const errorMsg = document.getElementById("error-msg");

        // Reset inputs and result
        resetBtn.addEventListener('click', () => {
            num1.value = '';
            num2.value = '';
            operator.value = '';
            result.innerText = 'Result: --';
            errorMsg.innerText = '';
        });

        // Perform calculation
        calcBtn.addEventListener('click', (e) => {
            e.preventDefault();
            calculate();
        });

        // Calculation logic
        const calculate = () => {
            // Clear previous errors
            errorMsg.innerText = '';

            const val1 = Number(num1.value);
            const val2 = Number(num2.value);
            const op = operator.value;

            if (!num1.value || !num2.value || !op) {
                errorMsg.innerText = 'Please fill in all fields and select an operator.';
                return;
            }

            if (op === 'division' && val2 === 0) {
                errorMsg.innerText = 'Division by zero is not allowed!';
                return;
            }

            let calcResult;
            switch (op) {
                case 'addition':
                    calcResult = val1 + val2;
                    break;
                case 'subtraction':
                    calcResult = val1 - val2;
                    break;
                case 'multiplication':
                    calcResult = val1 * val2;
                    break;
                case 'division':
                    calcResult = val1 / val2;
                    break;
                default:
                    errorMsg.innerText = 'Invalid operator selected!';
                    return;
            }

            result.innerText = `Result: ${calcResult}`;
        };

        // Allow pressing "Enter" to calculate
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
